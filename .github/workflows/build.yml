name: build

# 纯 registry 自包含构建流水线：本机无需 DSH 闭包（@deepseek-ai/* 作为 devDeps 安装）。
# 链路：typecheck → build(tsdown→tsc dts) → verify → selftest → （main push 时）自动回写 lib 产物。
#
# 包管理器为 pnpm（仓库只维护 pnpm-lock.yaml，本地开发同源）：
#   - pnpm install --frozen-lockfile：以 lockfile 为准，禁止 CI 侧改写依赖图。
#   - --ignore-scripts：防 postinstall；esbuild/rolldown 走 optionalDependencies 平台二进制，无需脚本。
#   - 运行时 peer（cordis / schemastery / dsh-scope 等）由宿主 DSH 闭包注入，CI 只需包本体在。
#
# 产物回写：[skip ci] + push paths 不含 lib/**，且 GITHUB_TOKEN 推送不会触发新工作流 → 无自循环。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'tsdown.config.ts'
      - 'cordis.patch.yml'
      - '.github/workflows/**'
  # PR 一律触发（不设 paths 过滤）：若把 workflow 列为必需状态检查，因 paths 过滤被跳过时
  # 检查会停在 "Expected" 永久阻塞合并（GitHub 确认行为）。
  # push 侧保留 paths 过滤：main 上的 lib 回写提交（仅 lib/**）不触发本工作流。
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (tsdown -> tsc dts)
        run: pnpm run build

      - name: Verify artifacts
        run: pnpm run verify

      # 注意：step 名里的 ": " 会让 YAML 视为映射分隔符，含冒号的名字必须加引号。
      - name: 'Selftest (domain: exposure / preset scope / migration)'
        run: node scripts/selftest-exposure.mjs

      - name: 'Selftest (policy store: migration / persistence / apply timing)'
        run: node scripts/selftest-policy.mjs

      - name: 'Selftest (composition file: block locate / remove / config rewrite)'
        run: node scripts/selftest-composition-file.mjs

      - name: 'Selftest (external import: format sniffing / field normalisation)'
        run: node scripts/selftest-external-import.mjs

      - name: 'Selftest (edit/remove orchestration: file write-back / readonly / rename)'
        run: node scripts/selftest-mcp-edit.mjs

      - name: 'Selftest (catalog / preset text / project mcp / conversion)'
        run: node scripts/selftest-mcp.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ github.sha }}
          path: |
            lib/index.js
            lib/catalog.js
            lib/exposure.js
            lib/composition-file.js
            lib/external-import.js
            lib/client.js
            lib/mcp-convert.js
            lib/types
          if-no-files-found: error

      - name: Auto-commit rebuilt lib/ artifacts (main push only)
        # 新仓库无 protect-main ruleset，默认 GITHUB_TOKEN（permissions.contents: write）即可直推 main；
        # actions/checkout 已把该 token 持久化为 origin 凭据，故无需 App token。
        # 守卫：GITHUB_TOKEN 推送本就不触发工作流，actor 判断为双保险。
        if: >-
          github.ref == 'refs/heads/main' && github.event_name == 'push'
          && github.actor != 'github-actions[bot]'
        run: |
          if [ -n "$(git status --porcelain -- lib/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/
            git commit -m "chore: rebuild lib artifacts via CI [skip ci]"
            git push
            echo "lib/ artifacts rebuilt and committed"
          else
            echo "lib/ is in sync, nothing to commit"
          fi
